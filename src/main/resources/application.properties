#* ============================================================
#* Soul Notes Backend — Application Configuration
#* ============================================================

#? ---- 向导标签规范 (Spec §7.3) ----
#? 向导条目元数据以 "# @tag arg" 注释写在配置项正上方, 由 PropertyMetaParser 运行时解析,
#? 本文件因此成为配置项展示信息的单一来源. 可用标签:
#?   @group 分组 (向导展示顺序即文件顺序) / @name 显示名 / @explain 说明 (可重复, 一行一条)
#?   @input url|text|secret|number|int|generate / @scheme 输入格式提示 / @min-length 最小长度 / @required 必填.
#?   int 与 number 的分界: int 拒绝小数 (消费方是整型配置键), number 允许任意正小数 (temperature/天气阈值).
#? 带标签且值行为 ${ENV:default} 形式的键才会进入向导; 无标签的框架键不参与解析.

#* ---- Datasource ----
quarkus.datasource.db-kind = postgresql
# @group 数据库
# @name 数据库连接地址
# @explain PostgreSQL 响应式连接地址, 格式 postgresql://host:port/dbname.
# @explain 容器部署时 host 填数据库服务名.
# @input url
# @scheme postgresql://
# @required
quarkus.datasource.reactive.url = ${SOULNOTES_DB_URL:postgresql://localhost:5432/soulnotes}

#! 占位从 ${SOULNOTES_DB_USER} 改为 ${SOULNOTES_DB_USER:}: 解析器只识别 ${ENV:default} 形式,
#! dev 环境由 application-dev.properties 覆盖为本地账号, 生产空值由 Pre-Launch 校验 (@required) 拦截.
# @group 数据库
# @name 数据库用户名
# @explain 生产环境必配, 向导收集后经环境变量注入.
# @input text
# @required
quarkus.datasource.username = ${SOULNOTES_DB_USER:}

# @group 数据库
# @name 数据库密码
# @explain 生产环境必配, 严禁写入版本库.
# @input secret
# @required
quarkus.datasource.password = ${SOULNOTES_DB_PASSWORD:}

#* ---- Redis ----
# @group 缓存
# @name Redis 地址
# @explain 格式 redis://host:port, 容器/K8s 部署必配, 指向 Redis 服务名.
# @input url
# @scheme redis://|rediss://
# @required
quarkus.redis.hosts = ${SOULNOTES_REDIS_HOSTS:redis://localhost:6379}

#* ---- JWT ----
#* 生产环境必须通过 SOULNOTES_JWT_SECRET 环境变量注入签名密钥 (至少 32 字节).
#* 未配置时 TokenService 会在启动时 fail-fast, 避免静默使用弱密钥.
# @group 安全
# @name JWT 签名密钥
# @explain HS256 对称密钥, 至少 32 字节, 未配置时启动 fail-fast.
# @input generate
# @min-length 32
# @required
jwt.secret = ${SOULNOTES_JWT_SECRET:}
# @group 安全
# @name Token 有效期 (秒)
# @explain 签发的 JWT 有效时长, 默认 604800 秒 (7 天).
# @input int
jwt.ttl-seconds = ${SOULNOTES_JWT_TTL:604800}

#* 预期 issuer 与 TokenService 签发的 iss claim 共用本键 (Spec §7.3): 单一属性同源喂给签发方与验签方,
#* 保证 ${SOULNOTES_JWT_ISSUER} 更换时双端同步; 中途更换将使全部已发 Token 立即失效 (iss 不匹配 -> 401).
# @group 安全
# @name JWT 签发者
# @explain 签发与验签共用本键, 更换后全部已发 Token 失效, 须同步重启全部实例.
# @input text
mp.jwt.verify.issuer = ${SOULNOTES_JWT_ISSUER:soul-notes}

#! 本项目使用 HS256 对称密钥 (jwt.secret) 验签, 不依赖 RSA 公钥; 显式声明 NONE 可阻止
#! quarkus dev mode 自动生成 RSA 密钥对并注入 mp.jwt.verify.publickey, 否则 JWTParser bean 上下文
#! 携带 RSA 公钥, 验签时 jose4j 会报 "RSAPublicKeyImpl cannot be used for HMAC verification" 导致全部请求 401.
mp.jwt.verify.publickey = NONE

#* ---- AI ----
# @group AI 接入
# @name AI 接口地址
# @explain OpenAI 兼容接口根地址, 可指向国内中转或自建网关.
# @input url
# @scheme https://|http://
# @required
ai.openai.endpoint=${SOULNOTES_AI_ENDPOINT:https://api.openai.com/v1}
# @group AI 接入
# @name 模型名称
# @explain 对话与情绪分析使用的模型, 默认 gpt-4o-mini.
# @input text
# @required
ai.openai.model-name=${SOULNOTES_AI_MODEL:gpt-4o-mini}
# @group AI 接入
# @name API 密钥
# @explain 默认为占位符 placeholder, 真实接入必须配置有效密钥.
# @input secret
# @required
ai.openai.api-key=${SOULNOTES_AI_API_KEY:placeholder}

#* ---- AI Advanced (LangChain4j) ----
#* LangChain4j 桥接键: 直接引用上方 ai.openai.* 的展开值, 不进入向导.
quarkus.langchain4j.openai.api-key=${ai.openai.api-key}
quarkus.langchain4j.openai.base-url=${ai.openai.endpoint}
quarkus.langchain4j.openai.chat-model.model-name=${ai.openai.model-name}
# @group AI 高级
# @name 生成温度
# @explain 越低越稳定, 越高越发散; 心理倾听场景建议 0.2-0.7.
# @input number
quarkus.langchain4j.openai.chat-model.temperature=${SOULNOTES_AI_TEMPERATURE:0.7}
# @group AI 高级
# @name 单次回复 Token 上限
# @explain 限制模型单次回复长度, 防止上下文超限.
# @input int
quarkus.langchain4j.openai.chat-model.max-completion-tokens=${SOULNOTES_AI_MAX_TOKENS:1024}

#? IDE 对 quarkus.langchain4j.openai.timeout 报"未知属性"为误报, 该属性是 quarkus-langchain4j 支持的配置项.
# @group AI 高级
# @name 请求超时
# @explain Quarkus Duration 格式, 如 30s / 1m.
# @input text
quarkus.langchain4j.openai.timeout=${SOULNOTES_AI_TIMEOUT:30s}
#* 结构化输出契约 ("副医生"预埋, Spec §7.5): 开启后共情提示词末尾追加输出契约段,
#* AI 回复末尾携带 <!--soulnotes {...}--> 结构化块, 后端拆流, 前端仅见文本; 存储/消费延后 (Spec §7.6).
#! 契约段随每条消息发送, 每请求新增数百 token, 默认 off 控制成本.
# @group AI 高级
# @name 结构化输出契约
# @explain 开启后 AI 回复附带结构化标签/风险等级/摘要, 供未来咨询员工作台消费; 填 on/true 开启, off/false 关闭.
# @explain 每条消息提示词将附加契约段, token 成本上升, 默认关闭.
# @input text
clinical.tagging = ${SOULNOTES_CLINICAL_TAGGING:false}
#* 结构定义配置化: 空白回退内置 canonical 结构 (免归一, 零 LLM 调用); 非空时启动期经 LLM 归一为
#* JSON Schema 并按 SHA-256 指纹缓存到 config/clinical-schema-cache.json, 未命中缓存的期间增强暂禁.
# @group AI 高级
# @name 副医生结构定义
# @explain 自然语言描述副医生输出 JSON 的字段与语义, 启动时自动经 LLM 归一为标准结构并缓存, 多行用 \n 转义.
# @explain 标识符 soulnotes 与注释块格式由系统固定勿动, 留空使用内置默认结构定义.
# @input text
ai.prompt.clinical-schema = ${SOULNOTES_PROMPT_CLINICAL_SCHEMA:}
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

#* ---- ASR (本地 Vosk 语音转写, 可插拔) ----
#* 向导展示顺序: 本组紧随 AI 高级组 (Spec §4.5).
#* asr.engine 非 vosk 时引擎 Bean 构造即抛 IllegalStateException 拒绝启动.
# @group ASR
# @name ASR 引擎
# @explain 当前仅 vosk 可选, 配置其他值将拒绝启动.
# @input text
asr.engine = ${SOULNOTES_ASR_ENGINE:vosk}
#* 布局约定: <runtime.dir>/lib/libvosk.(dll|so|dylib) + <runtime.dir>/model/<模型目录>.
# @group ASR
# @name ASR 运行时目录
# @explain 目录布局: lib/ 放动态库 (下载自动提取), model/ 放模型目录.
# @explain 未就绪时向导可现场下载, 也可手动放置后重试.
# @input text
asr.runtime.dir = ${SOULNOTES_ASR_RUNTIME_DIR:asr-model}
#* libvosk 来源: Maven Central 官方 JAR 的 aliyun 镜像为内置默认 (repo1 境内直连超时), 留空即用默认.
#? 注意该键指向 "JAR 地址" 而非动态库直链, 下载后从 JAR 内按平台 entry (win32-x86-64/libvosk.dll 等) 提取;
#? 指向其他版本 JAR 时可顺带获得 0.3.45 缺失的 arm 平台构建.
# @group ASR
# @name libvosk JAR 下载地址
# @explain libvosk 来源 (JAR 地址而非动态库直链), 默认阿里云镜像 0.3.45, 留空使用默认.
# @input text
asr.lib.url = ${SOULNOTES_ASR_LIB_URL:}

#* ---- Crisis Hotline ----
# @group 危机热线
# @name 热线名称
# @explain 展示于 RED 预警弹窗与离线兜底横幅.
# @input text
crisis.hotline.name = ${SOULNOTES_CRISIS_HOTLINE_NAME:全国心理援助热线}
# @group 危机热线
# @name 主热线号码
# @explain RED 预警弹窗首选热线.
# @input text
crisis.hotline.primary = ${SOULNOTES_CRISIS_HOTLINE_PRIMARY:400-161-9995}
# @group 危机热线
# @name 备用热线号码
# @explain 主热线不可用时的兜底号码.
# @input text
crisis.hotline.backup = ${SOULNOTES_CRISIS_HOTLINE_BACKUP:12355}

#* ---- CORS ----
quarkus.http.cors.enabled = true
# @group 网络
# @name 跨域白名单
# @explain 多个来源用逗号分隔, 生产环境应改为前端实际域名.
# @input text
quarkus.http.cors.origins = ${SOULNOTES_CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods = GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers = accept,authorization,content-type

#* ---- External Integrations ----
#? 集成组独立成组而非并入"网络": 承接机构侧外部系统对接 (Spec §7.3 规划的"网络-集成"拆分),
#? 后续 KNOWLEDGE_PACK 等平台化可插拔键统一并入此组; 紧随网络组, 向导展示顺序即文件顺序.
# @group 集成
# @name 预警 Webhook 地址
# @explain RED 预警时向机构服务端 POST JSON 负载, 与 WebSocket 在线推送互为冗余 (Spec §7.2).
# @explain 留空 = 该渠道禁用 (仅保留 WebSocket 在线推送); 负载形状: {type, userId, level, reason, hotline}.
# @input text
alert.webhook.url = ${SOULNOTES_ALERT_WEBHOOK_URL:}
# @group 集成
# @name 预警 Webhook 令牌
# @explain 机构侧鉴权令牌: 非空时请求携带 Authorization: Bearer <token>, 留空 = 不带鉴权头.
# @input text
alert.webhook.token = ${SOULNOTES_ALERT_WEBHOOK_TOKEN:}
# @group 集成
# @name 心理知识包
# @explain 心理小知识检索加载的包名, 对应 classpath 下 knowledge/{包名}/tips.md 块格式文件 (Spec §7.1).
# @explain 包缺失或解析为空时自动回退内置 default 包.
# @input text
knowledge.pack = ${SOULNOTES_KNOWLEDGE_PACK:default}

#* ---- Rate Limiting ----
#* 聊天与登录端点限流上限 (次/分钟), 均可用环境变量覆盖.
# @group 限流
# @name 聊天限流 (次/分钟)
# @explain 聊天端点每分钟最大请求数, 防止接口被恶意刷量.
# @input int
rate.limit.chat.max-per-minute = ${SOULNOTES_RATE_LIMIT_CHAT:20}
# @group 限流
# @name 登录限流 (次/分钟)
# @explain 登录端点每分钟最大请求数.
# @input int
rate.limit.login.max-per-minute = ${SOULNOTES_RATE_LIMIT_LOGIN:10}
#* 语音上传限流 (本地转录单请求成本高, 上限低于聊天); 占位无向导标签, 标签项随平台化任务 (Spec §7.3) 补齐.
rate.limit.voice.max-per-minute = ${SOULNOTES_RATE_LIMIT_VOICE:10}

#* ---- Voice Storage ----
# @group 语音
# @name 语音存储目录
# @explain 语音上传文件的落盘目录, 容器部署建议挂载 PVC.
# @input text
voice.storage.directory = ${SOULNOTES_VOICE_DIR:voice_uploads}
# @group 语音
# @name 单文件大小上限 (字节)
# @explain 超过上限的上传被拒绝, 默认 10485760 (10MiB).
# @input int
voice.storage.max-size = ${SOULNOTES_VOICE_MAX_BYTES:10485760}

#* ---- Emotion Weather Thresholds ----
#* 情绪天气预报映射阈值, 边界语义统一为 >=.
# @group 情绪阈值
# @name 风暴阈值
# @explain 焦虑或负向均值 >= 阈值判定为风暴.
# @input number
weather.threshold.storm = ${SOULNOTES_WEATHER_STORM:0.8}
# @group 情绪阈值
# @name 雨天阈值
# @explain 负向均值 >= 阈值判定为雨天.
# @input number
weather.threshold.rainy = ${SOULNOTES_WEATHER_RAINY:0.6}
# @group 情绪阈值
# @name 阴天阈值
# @explain 负向均值 >= 阈值判定为阴天.
# @input number
weather.threshold.overcast = ${SOULNOTES_WEATHER_OVERCAST:0.4}
# @group 情绪阈值
# @name 晴天阈值
# @explain 正向均值 >= 阈值判定为晴天.
# @input number
weather.threshold.sunny = ${SOULNOTES_WEATHER_SUNNY:0.6}

#* ---- Chat & AI Context ----
#* 对话历史滚动上限 (条), 防止 JSONB 无限增长与 Token 超限.
# @group 行为
# @name 对话历史上限 (条)
# @explain 滚动窗口上限, 防止 JSONB 无限增长与 Token 超限.
# @input int
chat.history.max-messages = ${SOULNOTES_CHAT_HISTORY_MAX:50}
#* 用户上下文工具回溯天数.
# @group 行为
# @name 上下文回溯天数
# @explain 用户上下文工具回溯近期日记与情绪记录的天数.
# @input int
ai.context.recent-days = ${SOULNOTES_MOOD_RECENT_DAYS:7}

#* ---- Prompts ----
#? 提示词覆盖键: 由 Pre-Launch 向导收集 (Spec §7.3), Agent 接线于后续任务完成; 未配置时保持代码内置提示词.
# @group 提示词
# @name 共情倾听提示词
# @explain 自定义倾听人设系统提示词, 留空使用内置默认; 多行用 \n 转义.
# @input text
ai.prompt.empathetic-chat = ${SOULNOTES_PROMPT_EMPATHETIC_CHAT:}
# @group 提示词
# @name 预警分级提示词
# @explain 自定义预警分级提示词, 留空使用内置默认; 多行用 \n 转义.
# @explain 覆盖 ai.prompt.warning-detection 时机构自担分级标准漂移风险 (RED 预警安全链路).
# @input text
ai.prompt.warning-detection = ${SOULNOTES_PROMPT_WARNING_DETECTION:}
# @group 提示词
# @name 情绪分析提示词
# @explain 自定义情绪/焦虑值解析提示词, 留空使用内置默认; 多行用 \n 转义.
# @input text
ai.prompt.mood-analysis = ${SOULNOTES_PROMPT_MOOD_ANALYSIS:}

#* ---- Brand ----
#* 品牌名属部署微调 (横幅首行展示), 非安全/基础设施关键项, 特意不加向导标签 (无 @group),
#* 不进向导清单; 消费点 Entrance#resolveBrandName 以同款 ${ENV:default} 优先序解析.
app.brand-name = ${SOULNOTES_BRAND_NAME:Soul Notes}

#* ---- Native Image ----
#* 业务时区为 Asia/Shanghai (TimeUtils), native 镜像固定默认时区.
#! Quarkus 3.36 无 quarkus.native.default-time-zone / include-all-time-zones 配置键 (NativeConfig 接口已核对),
#! GraalVM 21 起 native 默认内置全部时区 (官方字节码: IncludeAllTimeZones 已弃用), 只需经 additional-build-args 固定默认时区.
quarkus.native.additional-build-args = -Duser.timezone=Asia/Shanghai
#? Pre-Launch 的 PropertyMetaParser 在运行时读取本文件 (Spec §7.3), native 镜像需显式包含;
#? db/schema/*.sql 为向导 applySchema 的程序化权威源 (Spec §5), 同理必须显式包含, 否则 native 下脚本缺失快速失败.
#! knowledge/** 为心理知识包 (Spec §7.1), KnowledgePackLoader 运行时按 SOULNOTES_KNOWLEDGE_PACK 程序化加载,
#! 反射类加载器不可达路径, native 镜像必须显式包含 — 否则包缺失触发回退链, default 亦缺时检索直接不可用.
quarkus.native.resources.includes = application.properties,db/schema/*.sql,knowledge/**
