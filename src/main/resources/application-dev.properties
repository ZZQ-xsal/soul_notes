#* ============================================================
#* Soul Notes Backend — Dev 环境专用配置 (仅 quarkusDev 时加载)
#* ============================================================
#* 生产环境 (java -jar) 使用 prod profile, 此文件不会加载, 仍要求注入 SOULNOTES_JWT_SECRET 环境变量.
#* 提交仓库时, 若需保护本地数据库口令, 请在 .gitattributes 配置 text 处理或由 Git 提交过滤器处理.

#* ---- Dev 专用 JWT 密钥 (本地调试, 非生产密钥) ----
jwt.secret = ${SOULNOTES_JWT_SECRET:DEV_JWT_SECRET}

#* ---- Dev 本地数据库 (本机 Docker postgres 容器) ----
quarkus.datasource.username = ${SOULNOTES_DB_USER:kurv}
quarkus.datasource.password = ${SOULNOTES_DB_PASSWORD:DEV_DB_PASSWORD}
