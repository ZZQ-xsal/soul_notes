#* 开发/演示环境一键编排: PostgreSQL + Redis + 后端 (JVM 模式).
#* 构建后端镜像前必须先执行 ./gradlew build (Dockerfile.jvm 依赖 build/quarkus-app 产物).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soulnotes
      POSTGRES_USER: kurv
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurv -d soulnotes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      #* 全部可覆盖项均为 12-factor 环境变量, 与 application.properties 的 ${VAR:default} 对齐.
      SOULNOTES_DB_USER: kurv
      SOULNOTES_DB_PASSWORD: CHANGE_ME_DB_PASSWORD
      SOULNOTES_DB_URL: postgresql://postgres:5432/soulnotes
      SOULNOTES_REDIS_HOSTS: redis://redis:6379
      SOULNOTES_JWT_SECRET: change-me-32-bytes-minimum-secret-key!!
      SOULNOTES_CORS_ORIGINS: http://localhost:5173
      SOULNOTES_VOICE_DIR: /data/voice_uploads
    ports:
      - "8080:8080"
    volumes:
      - voice_uploads:/data/voice_uploads

volumes:
  pgdata:
  voice_uploads:
