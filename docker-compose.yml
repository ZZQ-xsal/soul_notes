#* 开发/演示环境一键编排: PostgreSQL + Redis + 后端 (JVM 模式).
#* 构建后端镜像前必须先执行 ./gradlew build (Dockerfile.jvm 依赖 build/quarkus-app 产物).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soulnotes
      POSTGRES_USER: kurv
      #* 口令经宿主环境/.env 插值 (与 backend 共用 SOULNOTES_DB_PASSWORD 一个来源), 兜底为公开开发占位符 — 严禁写入真实口令.
      POSTGRES_PASSWORD: ${SOULNOTES_DB_PASSWORD:-soulnotes_dev}
    ports:
      - "5432:5432"
    #* PostgreSQL 卷说明: 数据持久化于命名卷 pgdata, 首次启动为空库 — 后端启动校验对 schema 缺失 BLOCK,
    #* 需先完成一次初始化: `docker compose run --rm backend java -jar /deployments/quarkus-run.jar --setup` (向导自动建库建表)
    #* 或 `cat sql_scripts/*_init.sql | docker compose exec -T postgres psql -U kurv -d soulnotes`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurv -d soulnotes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      #* 全部可覆盖项均为 12-factor 环境变量, 与 application.properties 的 ${VAR:default} 对齐 (完整表见 README §7.1).
      SOULNOTES_DB_USER: kurv
      #* 与 postgres 服务同源插值: 宿主环境/.env 设置一次 SOULNOTES_DB_PASSWORD 即全局生效.
      SOULNOTES_DB_PASSWORD: ${SOULNOTES_DB_PASSWORD:-soulnotes_dev}
      SOULNOTES_DB_URL: postgresql://postgres:5432/soulnotes
      SOULNOTES_REDIS_HOSTS: redis://redis:6379
      SOULNOTES_JWT_SECRET: change-me-32-bytes-minimum-secret-key!!
      SOULNOTES_CORS_ORIGINS: http://localhost:5173
      SOULNOTES_VOICE_DIR: /data/voice_uploads
      #* AI 密钥: 占位符会被启动校验 BLOCK 拒绝启动, 部署前经宿主环境或向导生成的 .env (compose 自动读取) 注入有效密钥.
      SOULNOTES_AI_API_KEY: ${SOULNOTES_AI_API_KEY:-placeholder}
      #* ASR 运行时: 挂载点与卷对齐; 运行时可经向导下载到该卷, 或预先灌入模型/动态库 (见 README §8).
      SOULNOTES_ASR_RUNTIME_DIR: /data/asr-model
      #* 语音上传独立限流 (本地转录单请求成本高), 默认 10 次/分钟.
      SOULNOTES_RATE_LIMIT_VOICE: "10"
      #* JVM 模式 ASR 经 FFM 受限 native 调用, JDK 24+ 默认告警 — 显式放行 (run-java.sh 的追加槽, 不覆盖其默认 JVM 参数).
      JAVA_OPTS_APPEND: "--enable-native-access=ALL-UNNAMED"
    ports:
      - "8080:8080"
    volumes:
      - voice_uploads:/data/voice_uploads
      - asr_model:/data/asr-model

volumes:
  pgdata:
  voice_uploads:
  asr_model:
