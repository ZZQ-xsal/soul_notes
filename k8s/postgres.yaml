apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            #* 与 docker-compose.yml 保持一致; 生产建议改为引用 Secret, 避免明文.
            - name: POSTGRES_DB
              value: soulnotes
            - name: POSTGRES_USER
              value: kurv
            - name: POSTGRES_PASSWORD
              value: soulnotes_dev
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kurv", "-d", "soulnotes"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: soulnotes-postgres-pvc }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soulnotes-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
