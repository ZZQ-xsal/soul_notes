apiVersion: v1
kind: Secret
metadata:
  name: soulnotes-backend-secret
type: Opaque
stringData:
  SOULNOTES_DB_USER: "kurv"
  SOULNOTES_DB_PASSWORD: "soulnotes_dev"
  #! 生产必须替换为真实随机密钥 (≥32 字节), 且不应入库明文 — 这里仅作演示占位.
  SOULNOTES_JWT_SECRET: "change-me-32-bytes-minimum-secret-key!!"
  #! AI 密钥为启动硬门槛 (占位符 BLOCK 拒绝启动), 部署前必须替换为有效密钥.
  SOULNOTES_AI_API_KEY: "placeholder"
  #* 预警 Webhook 鉴权令牌 (非空时请求携带 Authorization: Bearer <token>); 渠道地址在 ConfigMap.
  SOULNOTES_ALERT_WEBHOOK_TOKEN: ""
